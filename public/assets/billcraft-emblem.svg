<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="bc-badge-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAF6EE" />
      <stop offset="100%" stop-color="#F2EBDB" />
    </linearGradient>
    <linearGradient id="bc-doc-grad" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#6F4AB6" />
      <stop offset="50%" stop-color="#593C8F" />
      <stop offset="100%" stop-color="#42296E" />
    </linearGradient>
    <linearGradient id="bc-gold-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="100%" stop-color="#F0B83A" />
    </linearGradient>
    <filter id="bc-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#17151F" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Container Squircle -->
  <rect width="48" height="48" rx="12" fill="url(#bc-badge-grad)" stroke="#E5DCCB" stroke-width="1.2" />

  <!-- Purple Document Sheet -->
  <path d="M 13 9 
           L 27 9 
           L 35 17 
           L 35 37 
           A 3 3 0 0 1 32 40 
           L 16 40 
           A 3 3 0 0 1 13 37 
           Z" 
        fill="url(#bc-doc-grad)" 
        filter="url(#bc-shadow)" />

  <!-- Golden Folded Corner Accent -->
  <path d="M 27 9 
           L 35 17 
           L 28.5 17 
           A 1.5 1.5 0 0 1 27 15.5 
           Z" 
        fill="url(#bc-gold-grad)" />

  <!-- Mint / Teal Checkmark -->
  <path d="M 18.5 25.5 
           L 23 30 
           L 30 20.5" 
        fill="none" 
        stroke="#A8D5BA" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Subtle Document Accent Line -->
  <rect x="18" y="34.5" width="12" height="1.8" rx="0.9" fill="#FFD066" opacity="0.9" />
</svg>