<svg xmlns="http://www.w3.org/2000/svg" width="500" height="120" viewBox="0 0 500 120">
  <defs>
    <linearGradient id="bc-doc-grad-lg" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#6F4AB6" />
      <stop offset="50%" stop-color="#593C8F" />
      <stop offset="100%" stop-color="#42296E" />
    </linearGradient>
    <linearGradient id="bc-gold-grad-lg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="100%" stop-color="#F0B83A" />
    </linearGradient>
    <filter id="bc-shadow-lg" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#17151F" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Emblem Group at (15, 12), size 96x96 -->
  <g transform="translate(15, 12)">
    <!-- Container Badge -->
    <rect width="96" height="96" rx="24" fill="#FAF6EE" stroke="#E5DCCB" stroke-width="2.2" />

    <!-- Purple Document Sheet -->
    <path d="M 26 18 
             L 54 18 
             L 70 34 
             L 70 74 
             A 6 6 0 0 1 64 80 
             L 32 80 
             A 6 6 0 0 1 26 74 
             Z" 
          fill="url(#bc-doc-grad-lg)" 
          filter="url(#bc-shadow-lg)" />

    <!-- Golden Folded Corner Accent -->
    <path d="M 54 18 
             L 70 34 
             L 57 34 
             A 3 3 0 0 1 54 31 
             Z" 
          fill="url(#bc-gold-grad-lg)" />

    <!-- Mint / Teal Checkmark -->
    <path d="M 37 51 
             L 46 60 
             L 60 41" 
          fill="none" 
          stroke="#A8D5BA" 
          stroke-width="5.8" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Subtle Golden Bottom Line Accent -->
    <rect x="36" y="69" width="24" height="3.5" rx="1.75" fill="#FFD066" opacity="0.9" />
  </g>

  <!-- Wordmark & Tagline -->
  <text x="135" y="66" font-family="Manrope, Inter, system-ui, sans-serif" font-weight="900" font-size="44" letter-spacing="1.5" fill="#17151F">
    BILL<tspan fill="#593C8F">CRAFT</tspan>
  </text>

  <!-- Studio Badge -->
  <g transform="translate(405, 38)">
    <rect width="66" height="22" rx="6" fill="#F1ECF8" />
    <text x="33" y="15" text-anchor="middle" font-family="Manrope, Inter, sans-serif" font-weight="900" font-size="10" letter-spacing="1.8" fill="#593C8F">
      STUDIO
    </text>
  </g>

  <!-- Tagline: CREATE • CALCULATE • SHARE -->
  <text x="136" y="93" font-family="Manrope, Inter, system-ui, sans-serif" font-weight="700" font-size="12" letter-spacing="3" fill="#6D6879">
    CREATE  •  CALCULATE  •  SHARE
  </text>
</svg>